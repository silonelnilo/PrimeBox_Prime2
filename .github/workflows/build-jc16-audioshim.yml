name: Build Prime 2 JC16 audio shim

on:
  workflow_dispatch:
  push:
    branches: [prime2-jc16]
    paths:
      - 'scripts/shims/audioshim.c'
      - 'scripts/shims/build-jc16-audioshim.sh'
      - '.github/workflows/build-jc16-audioshim.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi p7zip-full unzip bzip2 util-linux curl
      - name: Download official firmware
        run: |
          mkdir -p /tmp/rx3
          curl -fL --retry 3 'https://downloads.support.alphatheta.com/firmwares/all-in-one-dj-systems/XDJ-RX3/XDJ-RX3_v120.zip' -o /tmp/XDJ-RX3_v120.zip
          unzip -j /tmp/XDJ-RX3_v120.zip XDJRX3.UPD -d /tmp/rx3
          test "$(stat -c %s /tmp/rx3/XDJRX3.UPD)" = 69171216
      - name: Recover published GPL key
        run: |
          mkdir -p /tmp/gpl keys
          curl -fL --retry 3 'https://files.microcms-assets.io/assets/3b9e29ce734e49babfedb3f8d1e728e3/f7f69f5f428841898c6d98f9976c23bb/A9BEE4F7-6932-4E11-8D9F-5288F5F79EC2.zip' -o /tmp/gpl/part00.zip
          curl -fL --retry 3 'https://files.microcms-assets.io/assets/3b9e29ce734e49babfedb3f8d1e728e3/5b39b9d79cc747c2b31ff39e22074bad/57CB205B-D45A-4143-BC09-22D8400074C2.zip' -o /tmp/gpl/part01.zip
          unzip -j /tmp/gpl/part00.zip -d /tmp/gpl
          unzip -j /tmp/gpl/part01.zip -d /tmp/gpl
          cat /tmp/gpl/pioneerdj_xdj_rx3.tar.bz2.00 /tmp/gpl/pioneerdj_xdj_rx3.tar.bz2.01 > /tmp/gpl/rx3-src.tar.bz2
          tar -xOf /tmp/gpl/rx3-src.tar.bz2 pioneerdj_xdj_rx3/initramfs.tar.gz > /tmp/gpl/initramfs.tar.gz
          tar -xOf /tmp/gpl/initramfs.tar.gz initramfs/usr/local/pdj/aes256.key > keys/aes256.key
          test "$(stat -c %s keys/aes256.key)" = 90
      - name: Build decryptor
        run: cargo build --release --manifest-path tools/rx3dec/Cargo.toml
      - name: Extract RX3 sysroot
        run: |
          mkdir -p extracted/XDJRX3 extracted/XDJRX3-rootfs
          tools/rx3dec/target/release/rx3dec /tmp/rx3/XDJRX3.UPD keys/aes256.key extracted/XDJRX3.iso
          7z x -y extracted/XDJRX3.iso -oextracted/XDJRX3 >/dev/null
          7z x -y extracted/XDJRX3/images/rootfs.cramfs -oextracted/XDJRX3-rootfs >/dev/null
          test -f extracted/XDJRX3-rootfs/lib/libdl-2.13.so
          if [ ! -L extracted/XDJRX3-rootfs/lib/libdl.so.2 ]; then
            rm -f extracted/XDJRX3-rootfs/lib/libdl.so.2
            ln -s libdl-2.13.so extracted/XDJRX3-rootfs/lib/libdl.so.2
          fi
          test -L extracted/XDJRX3-rootfs/lib/libdl.so.2
      - name: Build JC16 audioshim
        run: |
          chmod +x scripts/shims/build-jc16-audioshim.sh
          RX3="$PWD/extracted/XDJRX3-rootfs" OUT="$PWD/audioshim-jc16.so" scripts/shims/build-jc16-audioshim.sh
      - name: Verify ABI
        run: |
          file audioshim-jc16.so
          ! arm-linux-gnueabi-readelf -A audioshim-jc16.so | grep -q Tag_ABI_VFP_args
          arm-linux-gnueabi-objdump -T audioshim-jc16.so | grep -o 'GLIBC_[0-9.]*' | sort -u
          sha256sum audioshim-jc16.so > audioshim-jc16.so.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: prime2-jc16-audioshim
          path: |
            audioshim-jc16.so
            audioshim-jc16.so.sha256
          if-no-files-found: error
