name: Build Prime 2 JC16 open payload

on:
  workflow_dispatch:
  push:
    branches: [prime2-jc16]
    paths:
      - '.github/workflows/build-jc16-open-payload.yml'
      - 'scripts/shims/**'
      - 'scripts/device/**'
      - 'tools/build-directfb/**'
      - 'tests/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check scripts and regression tests
        run: |
          for script in scripts/device/*jc16*.sh scripts/device/jc16-runtime.sh scripts/device/fix-dev.sh; do sh -n "$script"; done
          python3 -m unittest discover -s tests -v

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabi g++-arm-linux-gnueabi binutils-arm-linux-gnueabi libc6-dev-armel-cross \
            autoconf automake libtool pkg-config gettext patch patchelf git \
            p7zip-full unzip bzip2 curl make

      - name: Recover RX3 link sysroot from official firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rx3 /tmp/gpl keys extracted/XDJRX3 extracted/XDJRX3-rootfs
          curl -fL --retry 3 'https://downloads.support.alphatheta.com/firmwares/all-in-one-dj-systems/XDJ-RX3/XDJ-RX3_v120.zip' -o /tmp/XDJ-RX3_v120.zip
          unzip -j /tmp/XDJ-RX3_v120.zip XDJRX3.UPD -d /tmp/rx3
          test "$(stat -c %s /tmp/rx3/XDJRX3.UPD)" = 69171216

          curl -fL --retry 3 'https://files.microcms-assets.io/assets/3b9e29ce734e49babfedb3f8d1e728e3/f7f69f5f428841898c6d98f9976c23bb/A9BEE4F7-6932-4E11-8D9F-5288F5F79EC2.zip' -o /tmp/gpl/part00.zip
          curl -fL --retry 3 'https://files.microcms-assets.io/assets/3b9e29ce734e49babfedb3f8d1e728e3/5b39b9d79cc747c2b31ff39e22074bad/57CB205B-D45A-4143-BC09-22D8400074C2.zip' -o /tmp/gpl/part01.zip
          unzip -j /tmp/gpl/part00.zip -d /tmp/gpl
          unzip -j /tmp/gpl/part01.zip -d /tmp/gpl
          cat /tmp/gpl/pioneerdj_xdj_rx3.tar.bz2.00 /tmp/gpl/pioneerdj_xdj_rx3.tar.bz2.01 > /tmp/gpl/rx3-src.tar.bz2
          tar -xOf /tmp/gpl/rx3-src.tar.bz2 pioneerdj_xdj_rx3/initramfs.tar.gz > /tmp/gpl/initramfs.tar.gz
          tar -xOf /tmp/gpl/initramfs.tar.gz initramfs/usr/local/pdj/aes256.key > keys/aes256.key
          test "$(stat -c %s keys/aes256.key)" = 90

          cargo build --release --manifest-path tools/rx3dec/Cargo.toml
          tools/rx3dec/target/release/rx3dec /tmp/rx3/XDJRX3.UPD keys/aes256.key extracted/XDJRX3.iso
          7z x -y extracted/XDJRX3.iso -oextracted/XDJRX3 >/dev/null

          set +e
          7z x -y extracted/XDJRX3/images/rootfs.cramfs -oextracted/XDJRX3-rootfs >/dev/null
          zrc=$?
          set -e
          if [ "$zrc" -ne 0 ] && [ "$zrc" -ne 2 ]; then exit "$zrc"; fi

          R="$PWD/extracted/XDJRX3-rootfs"
          test -f "$R/lib/libc-2.13.so"
          test -f "$R/lib/libpthread-2.13.so"
          test -f "$R/lib/libdl-2.13.so"
          test -f "$R/lib/librt-2.13.so"
          test -f "$R/lib/libm-2.13.so"

          ln -sfn ld-2.13.so "$R/lib/ld-linux.so.3"
          ln -sfn libc-2.13.so "$R/lib/libc.so.6"
          ln -sfn libpthread-2.13.so "$R/lib/libpthread.so.0"
          ln -sfn libdl-2.13.so "$R/lib/libdl.so.2"
          ln -sfn librt-2.13.so "$R/lib/librt.so.1"
          ln -sfn libm-2.13.so "$R/lib/libm.so.6"
          ln -sfn libdirect-1.4.so.0.0.0 "$R/usr/lib/libdirect-1.4.so.0"
          ln -sfn libdirect-1.4.so.0.0.0 "$R/usr/lib/libdirect.so"
          ln -sfn libfusion-1.4.so.0.0.0 "$R/usr/lib/libfusion-1.4.so.0"
          ln -sfn libfusion-1.4.so.0.0.0 "$R/usr/lib/libfusion.so"
          ln -sfn libdirectfb-1.4.so.0.0.0 "$R/usr/lib/libdirectfb-1.4.so.0"
          ln -sfn libdirectfb-1.4.so.0.0.0 "$R/usr/lib/libdirectfb.so"
          ln -sfn ../../lib/libdl.so.2 "$R/usr/lib/libdl.so"
          ln -sfn ../../lib/libm.so.6 "$R/usr/lib/libm.so"
          ln -sfn ../../lib/librt.so.1 "$R/usr/lib/librt.so"

      - name: Build control and touch shims
        shell: bash
        run: |
          set -euo pipefail
          R="$PWD/extracted/XDJRX3-rootfs"
          python3 -c 'p="scripts/shims/fbshim-tsc.c"; s=open(p).read(); needle="#include <poll.h>\n"; repl=needle+"#ifdef open\n#undef open\n#endif\n#ifdef open64\n#undef open64\n#endif\n"; assert needle in s; open(p,"w").write(s.replace(needle,repl,1))'
          make -C scripts/shims RX3="$R" knobshim2.so fbshim-tsc.so seqinject2
          RX3="$R" OUT="$PWD/audioshim-jc16.so" sh scripts/shims/build-jc16-audioshim.sh
          for f in scripts/shims/knobshim2.so scripts/shims/fbshim-tsc.so audioshim-jc16.so; do
            file "$f"
            ! arm-linux-gnueabi-readelf -A "$f" | grep -q Tag_ABI_VFP_args
            vers="$(arm-linux-gnueabi-objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sort -u || true)"
            printf '%s: %s\n' "$f" "$vers"
            printf '%s\n' "$vers" | awk -F_ '/GLIBC_/ {split($2,v,"."); if (v[1] > 2 || (v[1] == 2 && v[2] > 7)) bad=1} END {exit bad ? 1 : 0}'
          done

      - name: Build patched DirectFB fbdev module
        shell: bash
        run: |
          set -euo pipefail
          R="$PWD/extracted/XDJRX3-rootfs"
          mkdir -p "$R/usr/include"
          cp -a /usr/arm-linux-gnueabi/include/. "$R/usr/include/"

          # Build against the same private module ABI as the RX3 libraries.
          git clone --no-checkout https://github.com/deniskropp/DirectFB.git /tmp/directfb
          git -C /tmp/directfb checkout 243d71d1cfa67ab3963590fe39b25d93a53333dc
          cd /tmp/directfb
          grep -Eq 'DFB_CORE_SYSTEM_ABI_VERSION +9$' src/core/system.h
          patch -p1 < "$GITHUB_WORKSPACE/tools/build-directfb/directfb-1.4.0-jc16.diff"

          cat > systems/fbdev/compat_shim.c <<'EOF'
          #define _GNU_SOURCE
          #include <core/system.h>
          const unsigned int primebox_dfb_system_abi = DFB_CORE_SYSTEM_ABI_VERSION;
          #include <sys/types.h>
          #include <sys/stat.h>
          #include <sys/select.h>
          #ifdef fstat
          #undef fstat
          #endif
          extern int __fxstat (int, int, struct stat *);
          int fstat (int fd, struct stat *buf)
          {
              return __fxstat (3, fd, buf);
          }
          long int __fdelt_chk (long int d)
          {
              return d / (8 * (long int) sizeof (unsigned long));
          }
          EOF

          cat "$GITHUB_WORKSPACE/scripts/shims/legacy-scan.c" >> systems/fbdev/compat_shim.c

          export CC=arm-linux-gnueabi-gcc
          export CXX=arm-linux-gnueabi-g++
          export CFLAGS="-O2 -march=armv5t -mfloat-abi=soft -U_FILE_OFFSET_BITS -D_FILE_OFFSET_BITS=32 -U_TIME_BITS -D_TIME_BITS=32 --sysroot=$R"
          export CXXFLAGS="$CFLAGS"
          export CPPFLAGS="--sysroot=$R"
          export LDFLAGS="--sysroot=$R -L$R/lib -L$R/usr/lib -Wl,-rpath-link,$R/lib:$R/usr/lib"
          ./autogen.sh \
            --host=arm-linux-gnueabi --prefix=/usr \
            --disable-x11 --disable-sdl --disable-vnc --disable-avifile \
            --with-gfxdrivers=none --disable-osx --disable-devmem

          make -C include directfb_strings.h directfb_keynames.h
          # Link the plugin directly to the original RX3 libraries. Building
          # new core libraries would silently change the private DirectFB ABI.
          mkdir -p systems/fbdev/.libs
          MOD=systems/fbdev/.libs/libdirectfb_fbdev.so
          $CC $CFLAGS -fPIC -shared -DHAVE_CONFIG_H -D_GNU_SOURCE \
            -I. -Iinclude -Ilib -Isrc -Isystems/fbdev \
            systems/fbdev/compat_shim.c systems/fbdev/agp.c \
            systems/fbdev/fbdev.c systems/fbdev/fbdev_surface_pool.c \
            systems/fbdev/surfacemanager.c systems/fbdev/vt.c \
            "$R/usr/lib/libdirect-1.4.so.0.0.0" \
            "$R/usr/lib/libfusion-1.4.so.0.0.0" \
            "$R/usr/lib/libdirectfb-1.4.so.0.0.0" \
            "$R/lib/libdl-2.13.so" "$R/lib/libpthread-2.13.so" \
            "$R/lib/libc-2.13.so" \
            $LDFLAGS -Wl,-z,defs -Wl,-soname,libdirectfb_fbdev.so -o "$MOD"
          python3 "$GITHUB_WORKSPACE/tools/build-directfb/verify-module.py" "$MOD" "$R"
          python3 "$GITHUB_WORKSPACE/tools/build-directfb/verify-rx3-links.py" "$R" "$MOD"
          python3 "$GITHUB_WORKSPACE/tools/build-directfb/verify-rx3-links.py" "$R" \
            "$GITHUB_WORKSPACE/scripts/shims/knobshim2.so" \
            "$GITHUB_WORKSPACE/scripts/shims/fbshim-tsc.so" \
            "$GITHUB_WORKSPACE/audioshim-jc16.so"
          cp "$MOD" "$GITHUB_WORKSPACE/libdirectfb_fbdev-rot16.so"

      - name: Assemble open payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p open-payload
          cp audioshim-jc16.so open-payload/
          cp scripts/shims/knobshim2.so open-payload/
          cp scripts/shims/fbshim-tsc.so open-payload/
          cp scripts/shims/seqinject2 open-payload/
          cp libdirectfb_fbdev-rot16.so open-payload/
          cp scripts/device/fix-dev.sh open-payload/
          cp scripts/device/usb-watch.sh open-payload/
          cp scripts/device/jc16-runtime.sh open-payload/
          cp scripts/device/start-rb-jc16.sh open-payload/
          cp scripts/device/stop-rb-jc16.sh open-payload/
          cp docs/12-prime2-jc16.md open-payload/README.md
          printf '%s\n' "$GITHUB_SHA" > open-payload/BUILD_COMMIT.txt
          chmod 755 open-payload/*.sh open-payload/seqinject2
          (cd open-payload && sha256sum * > SHA256SUMS.txt)
          tar -czf prime2-jc16-open-payload.tar.gz -C open-payload .

      - uses: actions/upload-artifact@v4
        with:
          name: prime2-jc16-open-payload
          path: prime2-jc16-open-payload.tar.gz
          if-no-files-found: error
